# Production nginx (Dockerfile.prod, nginxinc/nginx-unprivileged: runs as uid 101 and listens on 8080).
# Serves the built app and proxies /api/ to the backend container (audit G-11, IMP-10).
#
# TLS is not terminated here. Put a TLS proxy or load balancer in front (Caddy, Traefik, a cloud LB) and send
# it to this port. If that proxy is the only thing that can reach this port, uncomment the real_ip lines below
# so that the client's address (not the proxy's) reaches the backend's sign-in rate limits.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    # set_real_ip_from 10.0.0.0/8;     # the address range of the TLS proxy in front
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    # Docker's internal DNS. Resolving the backend per request (through a variable) lets nginx start before
    # the backend does and follow it when the container is recreated with a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Container healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The API: /api/auth/me -> http://backend:8000/auth/me (the backend's routes have no /api prefix).
    location /api/ {
        set $backend_upstream http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwritten, never appended: the backend trusts the first X-Forwarded-For entry
        # (TRUST_PROXY_HEADERS), so a client must not be able to put its own value there.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # A forced sentiment refresh runs one asset's pipeline (the frontend waits up to 30 s).
        proxy_read_timeout 120s;

        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Content-hashed bundles: cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The app shell must never be cached, or a deploy leaves browsers on old chunk names.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # react-router uses client-side routing (BrowserRouter): any path that isn't a real file falls back to
    # index.html (handled by the location above).
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
