# Security headers for every response (audit G-11, FE-05, G-31, N-08). Included in each location of nginx.conf,
# because nginx drops inherited add_header lines in any location that sets its own.
#
# CSP, by source:
#   'self'                         the app, and the API through the /api proxy
#   accounts.google.com/gsi/       Google sign-in (services/googleAuth.js), as Google documents for GIS
#   fonts.googleapis.com / gstatic DM Sans (styles/tokens.css)
#   img-src https:                 coin and NFT images come from many CDNs (CoinGecko, OpenSea, IPFS gateways)
#   style-src 'unsafe-inline'      index.html's inline <style> and libraries that inject style tags; scripts stay
#                                  strict, so an injected <script> or event handler still can't run
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# The Google sign-in popup reports back with postMessage, which "same-origin" would block.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
# Browsers honour this only over HTTPS, i.e. once a TLS proxy is in front.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
