# Continuous integration (audit G-27).
#
# Every job runs the same commands the README lists, so a failure here can be reproduced on a laptop:
#   backend      pytest in backend/ (with a real MongoDB, so the concurrency tests actually run)
#   sentiment    pytest in sentiment_engine/ (run from inside its folder)
#   aai          pytest on aai_engine (from the repo root)
#   ml           pytest on ml/tests (from the repo root, not from ml/)
#   frontend     eslint, unit tests and the production build
#   audit        pip-audit on every Python requirements file and npm audit on the shipped frontend packages
#   compose      docker compose config for the dev and production stacks (catches YAML and variable mistakes)
#
# The audit job also runs weekly: a new advisory can make it fail with no code change. That is the point.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC, for the audit job
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A throwaway MongoDB: tests/test_holdings_atomic.py and test_onboarding.py race real requests against it.
    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      MONGO_TEST_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"        # the version the backend image uses
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            sentiment_engine/requirements.txt
      - name: "Install (torch is left out, since nothing in the tests loads FinBERT)"
        run: |
          python -m pip install --upgrade pip
          # The backend image's lock file without torch and its CUDA packages (it already includes pytest).
          grep -vE '^(torch|nvidia-|triton)' backend/requirements.txt > "$RUNNER_TEMP/backend-no-torch.txt"
          pip install -r "$RUNNER_TEMP/backend-no-torch.txt"
      - name: pytest
        working-directory: backend
        run: python -m pytest tests -q -p no:cacheprovider

  sentiment:
    name: Sentiment engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sentiment_engine/requirements.txt
      - name: Install (without torch)
        run: |
          python -m pip install --upgrade pip
          grep -v '^torch' sentiment_engine/requirements.txt > "$RUNNER_TEMP/sentiment-no-torch.txt"
          pip install -r "$RUNNER_TEMP/sentiment-no-torch.txt"
      - name: "pytest (from inside the folder, because its imports are relative to it)"
        working-directory: sentiment_engine
        run: python -m pytest tests -q -p no:cacheprovider

  aai:
    name: AAI engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - name: pytest (from the repo root)
        run: python -m pytest aai_engine -q -p no:cacheprovider

  ml:
    name: ML tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"        # the version the ml image uses
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: "Install (pyarrow is the one training-only package the tests need, for the NFT snapshot files)"
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt pyarrow==26.0.1
      - name: "pytest (from the repo root; since N-10 it also works from ml/)"
        run: python -m pytest ml/tests -q -p no:cacheprovider

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: pip-audit, pinned files (sentiment engine without torch, ML)
        run: |
          pip install pip-audit
          grep -v '^torch' sentiment_engine/requirements.txt > "$RUNNER_TEMP/sentiment-no-torch.txt"
          pip-audit -r "$RUNNER_TEMP/sentiment-no-torch.txt" --no-deps --disable-pip
          pip-audit -r ml/requirements.txt --no-deps --disable-pip
      - name: pip-audit, backend image lock file (fully pinned, torch included)
        run: pip-audit -r backend/requirements.txt --no-deps --disable-pip
      - name: npm audit, packages shipped to the browser
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

  compose:
    name: Compose files are valid
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Development stack
        run: docker compose -f docker-compose.yml config --quiet
        env:
          JWT_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
      - name: Production stack
        # The example leaves the secrets empty, and the production file refuses to resolve without them.
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod.example config --quiet
        env:
          FRONTEND_BASE_URL: https://altinvest.example
          JWT_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
          MONGO_ROOT_PASSWORD: ci-only-not-a-secret
          MONGO_APP_PASSWORD: ci-only-not-a-secret
      - name: Production images build
        run: |
          docker build -f frontend/Dockerfile.prod -t altinvest-frontend:ci frontend
          docker run --rm --entrypoint nginx altinvest-frontend:ci -t
